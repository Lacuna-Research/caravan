name: docs

# Runs on every PR and every push to main. Ubuntu only, and fast.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Documentation discipline
        run: ./Scripts/check-docs.sh "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      - name: shellcheck
        run: shellcheck Scripts/*.sh .githooks/*

  secrets:
    # GitHub secret scanning and push protection are both on (free, public repo), but
    # they target provider-issued tokens. This project's risk is a captured IRC trace
    # or a real NickServ password pasted into a fixture, which those will not catch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks enumerates the PR's commits to scan the range
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
