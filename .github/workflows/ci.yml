name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  purity:
    # IRCProtocol must stay free of AppKit, Network.framework and Darwin os.Logger.
    # Linux has none of them, so this job fails the moment that rule is broken —
    # a convention in CLAUDE.md turned into something a machine checks.
    #
    # Package.swift reduces itself to IRCProtocol and its tests when os(Linux), so
    # plain `swift test` here builds and *runs* the parser suite cross-platform
    # rather than merely compiling the module. Portability tested, not asserted.
    # Pinned to the same toolchain used locally.
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      - name: Build IRCProtocol on Linux
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run the parser tests on Linux
        run: swift test -Xswiftc -warnings-as-errors

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          # Keyed on Package.swift rather than Package.resolved: with zero external
          # dependencies there is no resolved file to hash.
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests App Package.swift

      - name: Build the app
        # Keeps irc-client.xcodeproj honest. The package builds under Command Line
        # Tools, but the app target needs Xcode and would otherwise rot unnoticed.
        run: xcodebuild -project irc-client.xcodeproj -scheme IRCClient -configuration Debug build
